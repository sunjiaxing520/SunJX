<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8e4dc"/><stop offset="1" stop-color="#ddd8ce"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#736955" flood-opacity=".2"/></filter><clipPath id="c"><rect x="116" y="103" width="968" height="550" rx="15"/></clipPath></defs><rect width="1200" height="760" fill="url(#bg)"/><g filter="url(#s)"><rect x="116" y="103" width="968" height="550" rx="15" fill="#fdfcf9"/></g><g clip-path="url(#c)" font-family="Arial,sans-serif"><rect x="116" y="103" width="175" height="550" fill="#f2f0e9"/><circle cx="137" cy="123" r="4" fill="#c6beb0"/><circle cx="152" cy="123" r="4" fill="#d9d2c6"/><circle cx="167" cy="123" r="4" fill="#d9d2c6"/><text x="140" y="176" font-size="24" fill="#363c32" font-family="Georgia,serif">margin.</text><text x="140" y="203" font-size="9" fill="#95988b">A little room for thought.</text><rect x="133" y="237" width="141" height="34" rx="6" fill="#e3e6da"/><text x="149" y="259" font-size="11" fill="#59674d">▤  All notes</text><text x="149" y="299" font-size="11" fill="#8a8b81">☆  Favourites</text><text x="149" y="339" font-size="11" fill="#8a8b81">◷  Recently edited</text><text x="140" y="404" font-size="8" fill="#999b90" letter-spacing="2">COLLECTIONS</text><text x="149" y="440" font-size="10" fill="#777e6c">●　Everyday ideas</text><text x="149" y="476" font-size="10" fill="#959588">●　Things to make</text><text x="149" y="512" font-size="10" fill="#959588">●　A slower life</text><path d="M291 103v550M550 103v550" stroke="#e6e5de"/>
<text x="316" y="151" font-size="15" fill="#474d40" font-weight="bold">All notes</text><text x="512" y="151" font-size="18" fill="#8b947c">＋</text><rect x="310" y="175" width="221" height="29" rx="5" fill="#f1f0eb"/><text x="324" y="194" font-size="10" fill="#a5a69a">⌕  Search your thoughts</text><rect x="306" y="225" width="231" height="104" rx="7" fill="#edf0e5"/><text x="322" y="252" font-size="12" fill="#4d5743" font-weight="bold">Less, but more meaningful.</text><text x="322" y="275" font-size="10" fill="#8c9382">A few thoughts on making space</text><text x="322" y="292" font-size="10" fill="#8c9382">for what really matters.</text><text x="322" y="315" font-size="8" fill="#9fa693">TODAY · 10:24</text><text x="322" y="367" font-size="12" fill="#666b5e">Small things, good days</text><text x="322" y="391" font-size="10" fill="#a5a69a">Coffee, a walk, a new idea...</text><text x="322" y="419" font-size="8" fill="#a5a69a">YESTERDAY</text><path d="M322 441h199" stroke="#ecebe5"/><text x="322" y="477" font-size="12" fill="#666b5e">Something worth building</text><text x="322" y="501" font-size="10" fill="#a5a69a">It always starts with a question.</text><text x="322" y="529" font-size="8" fill="#a5a69a">OCT 20</text>
<text x="591" y="151" font-size="9" fill="#a3a697">EVERYDAY IDEAS</text><text x="1017" y="151" font-size="14" fill="#a3a697">···</text><text x="592" y="223" font-family="Georgia,serif" font-size="35" fill="#3f4836">Less, but more</text><text x="592" y="266" font-family="Georgia,serif" font-size="35" fill="#3f4836">meaningful.</text><text x="594" y="302" font-size="9" fill="#a6aa9b">October 24, 2026　·　2 min read</text><text x="594" y="351" font-size="12" fill="#858a79">Not every moment needs to be filled.</text><text x="594" y="379" font-size="12" fill="#858a79">Not every idea needs to be perfect.</text><text x="594" y="421" font-size="12" fill="#858a79">Sometimes, the best thing we can do is leave</text><text x="594" y="449" font-size="12" fill="#858a79">a little space — for a thought, a pause,</text><text x="594" y="477" font-size="12" fill="#858a79">or something we haven't imagined yet.</text><path d="M595 518v44" stroke="#b8c0a8" stroke-width="3"/><text x="613" y="545" font-family="Georgia,serif" font-size="16" fill="#707d60">Make room for what matters.</text><text x="594" y="612" font-size="8" fill="#b4b6ab">ALL CHANGES SAVED</text></g></svg>
